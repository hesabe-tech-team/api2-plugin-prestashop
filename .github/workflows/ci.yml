name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      # Every string the module translates has an Arabic entry, keyed as PrestaShop looks it up.
      - run: php scripts/translations.php

  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prestashop: ['8.2.8-8.1-apache', '9.2.0-8.1']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      # Analysed inside the official image, against the core classes of that version.
      - run: >
          docker run --rm --entrypoint sh
          -v "$PWD:/var/www/html/modules/hesabe" -w /var/www/html/modules/hesabe
          -e _PS_ROOT_DIR_=/var/www/html
          prestashop/prestashop:${{ matrix.prestashop }}
          -c 'php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress'

  # Builds the zip, installs it into a clean shop the way a merchant does, and pays real
  # sandbox orders through it with Hesabe's public test card. Hesabe must reach the shop,
  # so a Cloudflare quick tunnel fronts it. The sandbox credentials are Hesabe's published
  # test account.
  e2e:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        prestashop: ['8.2.8-8.1-apache', '9.2.0-8.1']
    env:
      HESABE_ENVIRONMENT: sandbox
      HESABE_MERCHANT_CODE: '842217'
      HESABE_ACCESS_CODE: c333729b-d060-4b74-a49d-7686a8353481
      HESABE_SECRET_KEY: PkW64zMe5NVdrlPVNnjo2Jy9nOb7v1Xg
      HESABE_IV_KEY: 5NVdrlPVNnjo2Jy9
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: sh scripts/build.sh
      - name: Tunnel
        run: |
          docker run -d --name tunnel --add-host=host.docker.internal:host-gateway \
            cloudflare/cloudflared:latest tunnel --no-autoupdate --url http://host.docker.internal:8080
          for i in $(seq 1 30); do
            host=$(docker logs tunnel 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | head -1)
            [ -n "$host" ] && break; sleep 2
          done
          echo "SHOP_HOST=${host#https://}" >> "$GITHUB_ENV"
      - name: Shop
        env:
          PS_IMAGE: prestashop/prestashop:${{ matrix.prestashop }}
          PS_ENABLE_SSL: 1
        run: |
          PS_DOMAIN=$SHOP_HOST docker compose -f dev/docker-compose.yml -f dev/docker-compose.clean.yml up -d
          for i in $(seq 1 120); do
            docker compose -f dev/docker-compose.yml logs shop 2>&1 | grep -q 'resuming normal operations' && break; sleep 5
          done
      - name: Install the zip
        run: |
          shop="docker compose -f dev/docker-compose.yml -f dev/docker-compose.clean.yml"
          $shop cp build/hesabe.zip shop:/tmp/hesabe.zip
          $shop cp dev/setup-shop.php shop:/tmp/setup-shop.php
          $shop exec -T -u www-data shop sh -c 'php -r "\$z = new ZipArchive(); \$z->open(\"/tmp/hesabe.zip\"); \$z->extractTo(\"modules/\");"'
          $shop exec -T -u www-data shop php bin/console prestashop:module install hesabe
          $shop exec -T -u www-data \
            -e HESABE_ENVIRONMENT -e HESABE_MERCHANT_CODE -e HESABE_ACCESS_CODE -e HESABE_SECRET_KEY -e HESABE_IV_KEY \
            shop php bin/console hesabe:configure --methods=knet,card,hosted
          $shop exec -T -u www-data shop sh -c 'mkdir -p modules/hesabe/dev && cp /tmp/setup-shop.php modules/hesabe/dev/ && php modules/hesabe/dev/setup-shop.php && rm -r modules/hesabe/dev && php bin/console cache:clear'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pay
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          SHOP_URL=https://$SHOP_HOST node checkout.mjs knet
          SHOP_URL=https://$SHOP_HOST node checkout.mjs hosted
          SHOP_URL=https://$SHOP_HOST node checkout.mjs knet cancel
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.prestashop }}
          path: tests/e2e/results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, phpstan, e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: sh scripts/build.sh
      - run: gh release create "$GITHUB_REF_NAME" build/hesabe.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
